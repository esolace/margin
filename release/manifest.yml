name: Margin
version: 0.5.0-alpha.9
authors:
  - Solace
description: >
  Designed component labels for Grasshopper 1 and 2, plus styled native groups.
  Open Display > Margin > Open Studio to choose presets and edit typography,
  colours, backgrounds, borders and spacing. Includes installed fonts, five
  label styles, eight vivid group presets and a personal label preset library.
  No canvas component is required. Label visibility is remembered across files
  and restarts. Native groups support editable or hidden titles and saved appearance defaults.

  All 13 Rhino languages, with automatic selection and a saved manual override.
  Mac tested on Apple Silicon: Rhino 8.37 with Grasshopper 1 and Rhino 9.1
  with Grasshopper 2, including native workflows and full restart persistence.
  Rhino 9 GH1 retains prior alpha.7 native coverage; current shared GH1 code
  was tested in Rhino 8. Windows experimental: build and package checks passed,
  interactive validation pending. Physical canvas title double-click retesting
  is incomplete; native handler and editor checks passed. Translation review pending.
  Requires Rhino 8.21+ with .NET 8+, or Rhino 9 with .NET 10.
  Rhino 9 Mac requires 9.1; Windows requires 9.0.26300+. GH2 requires Rhino 9.
url: https://github.com/esolace/margin
icon: icon.png
keywords:
  - grasshopper
  - grasshopper2
  - labels
  - groups
  - typography
  - presets
  - canvas
  - appearance
